"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf).
"""
scalar JSON

scalar BigInt

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type ViewPageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

type Meta {
  status: JSON
}

type Query {
  listing(id: String!): listing
  listings(where: listingFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): listingPage!
  sale(id: String!): sale
  sales(where: saleFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): salePage!
  checkIn(id: String!): checkIn
  checkIns(where: checkInFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): checkInPage!
  _meta: Meta
}

