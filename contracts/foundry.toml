[profile.default]
src      = "src"
out      = "out"
libs     = ["lib"]
optimizer       = true
optimizer_runs  = 200
via_ir          = true

remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/"
]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs  = 64
depth = 15

[rpc_endpoints]
base_sepolia = "https://base-sepolia.g.alchemy.com/v2/${ALCHEMY_API_KEY}"

